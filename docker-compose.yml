services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: albdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: albdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U albdata"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: albdata:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://albdata:${POSTGRES_PASSWORD}@db:5432/albdata
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 10

  worker:
    image: albdata:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://albdata:${POSTGRES_PASSWORD}@db:5432/albdata
    command: ["npx", "tsx", "src/worker/index.ts"]
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      TRACKING_DOMAINS: ${TRACKING_DOMAINS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
